<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico de Diabetes: Glicose vs IMC</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #chart-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #cccccc;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 12px;
      color: #333;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 10;
      line-height: 1.5;
    }
    #tooltip b {
      color: #000;
    }
  </style>
</head>
<body>
  <div id="chart-wrapper">
    <canvas id="plot"></canvas>
    <div id="tooltip"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

  <script>
    (async function() {
      const url = 'https://raw.githubusercontent.com/npradaschnor/Pima-Indians-Diabetes-Dataset/refs/heads/master/diabetes.csv';

      const response = await fetch(url);
      const csvText = await response.text();

      const lines = csvText.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
      const glucoseIdx = headers.indexOf('Glucose');
      const bmiIdx = headers.indexOf('BMI');
      const outcomeIdx = headers.indexOf('Outcome');

      const naoDiabeticos = [];
      const diabeticos = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',');
        if (cols.length < Math.max(glucoseIdx, bmiIdx, outcomeIdx) + 1) continue;
        const glucose = parseFloat(cols[glucoseIdx]);
        const bmi = parseFloat(cols[bmiIdx]);
        const outcome = parseInt(cols[outcomeIdx], 10);

        if (glucose > 0 && bmi > 0) {
          if (outcome === 0) {
            naoDiabeticos.push({ x: glucose, y: bmi, label: 'Não diabético' });
          } else {
            diabeticos.push({ x: glucose, y: bmi, label: 'Diabético' });
          }
        }
      }

      // Criar tensores TensorFlow.js
      const naoDiabeticosTensor = tf.tensor2d(naoDiabeticos.map(p => [p.x, p.y]));
      const diabeticosTensor = tf.tensor2d(diabeticos.map(p => [p.x, p.y]));

      // Obter dados dos tensores para plotagem
      const naoData = Array.from(naoDiabeticosTensor.dataSync());
      const diaData = Array.from(diabeticosTensor.dataSync());

      const naoParsed = [];
      for (let i = 0; i < naoData.length; i += 2) {
        naoParsed.push({ x: naoData[i], y: naoData[i + 1], label: 'Não diabético' });
      }
      const diaParsed = [];
      for (let i = 0; i < diaData.length; i += 2) {
        diaParsed.push({ x: diaData[i], y: diaData[i + 1], label: 'Diabético' });
      }

      const allPoints = [...naoParsed, ...diaParsed];

      // Calcular domínios dos eixos
      const allX = allPoints.map(p => p.x);
      const allY = allPoints.map(p => p.y);
      const xMin = Math.min(...allX);
      const xMax = Math.max(...allX);
      const yMin = Math.min(...allY);
      const yMax = Math.max(...allY);

      const xPad = (xMax - xMin) * 0.05 || 1;
      const yPad = (yMax - yMin) * 0.05 || 1;
      const xDomain = [xMin - xPad, xMax + xPad];
      const yDomain = [yMin - yPad, yMax + yPad];

      const wrapper = document.getElementById('chart-wrapper');
      const canvas = document.getElementById('plot');
      const ctx = canvas.getContext('2d');
      const tooltip = document.getElementById('tooltip');

      let width, height, margin, plotWidth, plotHeight;

      function niceTicks(min, max, count) {
        const span = max - min;
        const step = span / count;
        const mag = Math.pow(10, Math.floor(Math.log10(step)));
        const err = step / mag;
        let niceStep;
        if (err <= 1) niceStep = mag;
        else if (err <= 2) niceStep = 2 * mag;
        else if (err <= 5) niceStep = 5 * mag;
        else niceStep = 10 * mag;
        const niceMin = Math.floor(min / niceStep) * niceStep;
        const niceMax = Math.ceil(max / niceStep) * niceStep;
        const ticks = [];
        for (let v = niceMin; v <= niceMax + niceStep * 0.001; v += niceStep) {
          ticks.push(parseFloat(v.toPrecision(12)));
        }
        return { min: niceMin, max: niceMax, step: niceStep, ticks };
      }

      const xNice = niceTicks(xDomain[0], xDomain[1], 8);
      const yNice = niceTicks(yDomain[0], yDomain[1], 6);

      function computeLayout() {
        const rect = wrapper.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        width = rect.width;
        height = rect.height;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        margin = {
          top: height * 0.1,
          right: width * 0.05,
          bottom: height * 0.1,
          left: width * 0.1
        };
        plotWidth = width - margin.left - margin.right;
        plotHeight = height - margin.top - margin.bottom;
      }

      function toPx(x, y) {
        const xPx = margin.left + ((x - xNice.min) / (xNice.max - xNice.min)) * plotWidth;
        const yPx = margin.top + plotHeight - ((y - yNice.min) / (yNice.max - yNice.min)) * plotHeight;
        return [xPx, yPx];
      }

      function render() {
        computeLayout();

        // Fundo branco
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);

        // Grade e eixos
        ctx.strokeStyle = '#e5e5e5';
        ctx.lineWidth = 1;

        // Grid X
        for (const xVal of xNice.ticks) {
          const xPx = margin.left + ((xVal - xNice.min) / (xNice.max - xNice.min)) * plotWidth;
          ctx.beginPath();
          ctx.moveTo(xPx, margin.top);
          ctx.lineTo(xPx, margin.top + plotHeight);
          ctx.stroke();
        }

        // Grid Y
        for (const yVal of yNice.ticks) {
          const yPx = margin.top + plotHeight - ((yVal - yNice.min) / (yNice.max - yNice.min)) * plotHeight;
          ctx.beginPath();
          ctx.moveTo(margin.left, yPx);
          ctx.lineTo(margin.left + plotWidth, yPx);
          ctx.stroke();
        }

        // Eixos principais
        ctx.strokeStyle = '#444444';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(margin.left, margin.top);
        ctx.lineTo(margin.left, margin.top + plotHeight);
        ctx.lineTo(margin.left + plotWidth, margin.top + plotHeight);
        ctx.stroke();

        // Rótulos dos eixos
        ctx.fillStyle = '#444444';
        ctx.font = Math.max(10, width * 0.015) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        for (const xVal of xNice.ticks) {
          const xPx = margin.left + ((xVal - xNice.min) / (xNice.max - xNice.min)) * plotWidth;
          ctx.fillText(Math.round(xVal).toString(), xPx, margin.top + plotHeight + height * 0.015);
        }

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (const yVal of yNice.ticks) {
          const yPx = margin.top + plotHeight - ((yVal - yNice.min) / (yNice.max - yNice.min)) * plotHeight;
          ctx.fillText(yVal.toFixed(1), margin.left - width * 0.012, yPx);
        }

        // Títulos dos eixos
        ctx.save();
        ctx.translate(width * 0.02, margin.top + plotHeight / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = 'center';
        ctx.font = Math.max(11, width * 0.018) + 'px sans-serif';
        ctx.fillStyle = '#333333';
        ctx.fillText('Índice de Massa Corporal (IMC)', 0, 0);
        ctx.restore();

        ctx.textAlign = 'center';
        ctx.font = Math.max(11, width * 0.018) + 'px sans-serif';
        ctx.fillStyle = '#333333';
        ctx.fillText('Nível de Glicose no Sangue (mg/dL)', margin.left + plotWidth / 2, height - height * 0.03);

        // Título do gráfico
        ctx.textAlign = 'center';
        ctx.font = 'bold ' + Math.max(13, width * 0.02) + 'px sans-serif';
        ctx.fillStyle = '#333333';
        ctx.fillText('Diagnóstico de Diabetes: Glicose vs IMC', width / 2, height * 0.04);

        // Plotar pontos com opacidade 0.7 (igual ao original)
        const pointRadius = Math.max(2.5, width * 0.005);
        function drawPoints(points, color) {
          ctx.fillStyle = color;
          ctx.globalAlpha = 0.7;
          for (const p of points) {
            const [xPx, yPx] = toPx(p.x, p.y);
            ctx.beginPath();
            ctx.arc(xPx, yPx, pointRadius, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1.0;
        }

        drawPoints(naoParsed, '#1f77b4');
        drawPoints(diaParsed, '#d62728');

        // Legenda
        const legendW = width * 0.18;
        const legendH = height * 0.11;
        const legendX = margin.left + plotWidth - legendW;
        const legendY = margin.top + height * 0.015;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = 1;
        ctx.fillRect(legendX, legendY, legendW, legendH);
        ctx.strokeRect(legendX, legendY, legendW, legendH);

        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.font = Math.max(10, width * 0.015) + 'px sans-serif';
        ctx.fillStyle = '#333333';
        ctx.fillText('Resultado', legendX + width * 0.01, legendY + legendH * 0.22);

        ctx.fillStyle = '#1f77b4';
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.arc(legendX + width * 0.02, legendY + legendH * 0.55, pointRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#333333';
        ctx.fillText('Não diabético', legendX + width * 0.035, legendY + legendH * 0.55);

        ctx.fillStyle = '#d62728';
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.arc(legendX + width * 0.02, legendY + legendH * 0.82, pointRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#333333';
        ctx.fillText('Diabético', legendX + width * 0.035, legendY + legendH * 0.82);
      }

      render();
      window.addEventListener('resize', render);

      // Interatividade de hover
      let hoveredPoint = null;
      const hoverRadius = Math.max(6, width * 0.012);

      canvas.addEventListener('mousemove', function(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.offsetX;
        const mouseY = e.offsetY;

        let found = null;
        for (const p of allPoints) {
          const [xPx, yPx] = toPx(p.x, p.y);
          const dx = mouseX - xPx;
          const dy = mouseY - yPx;
          if (dx * dx + dy * dy <= hoverRadius * hoverRadius) {
            found = p;
            break;
          }
        }

        if (found) {
          if (hoveredPoint !== found) {
            hoveredPoint = found;
            tooltip.style.display = 'block';
            tooltip.innerHTML = '<b>Glicose:</b> ' + found.x + ' mg/dL<br><b>IMC:</b> ' + found.y.toFixed(1);
          }
          tooltip.style.left = (e.offsetX + 12) + 'px';
          tooltip.style.top = (e.offsetY - 12) + 'px';
        } else {
          if (hoveredPoint) {
            hoveredPoint = null;
            tooltip.style.display = 'none';
          }
        }
      });

      canvas.addEventListener('mouseleave', function() {
        hoveredPoint = null;
        tooltip.style.display = 'none';
      });

      // Suporte a touch para mobile
      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const mouseX = touch.clientX - rect.left;
        const mouseY = touch.clientY - rect.top;

        let found = null;
        for (const p of allPoints) {
          const [xPx, yPx] = toPx(p.x, p.y);
          const dx = mouseX - xPx;
          const dy = mouseY - yPx;
          if (dx * dx + dy * dy <= hoverRadius * hoverRadius * 2.5) {
            found = p;
            break;
          }
        }

        if (found) {
          tooltip.style.display = 'block';
          tooltip.innerHTML = '<b>Glicose:</b> ' + found.x + ' mg/dL<br><b>IMC:</b> ' + found.y.toFixed(1);
          tooltip.style.left = mouseX + 'px';
          tooltip.style.top = (mouseY - 40) + 'px';
        } else {
          tooltip.style.display = 'none';
        }
      }, { passive: false });

      canvas.addEventListener('touchend', function() {
        setTimeout(() => { tooltip.style.display = 'none'; }, 1500);
      });

      // Liberar tensores
      naoDiabeticosTensor.dispose();
      diabeticosTensor.dispose();
    })();
  </script>
</body>
</html>
